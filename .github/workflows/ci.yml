name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node 22 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Windows DPAPI self-test
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Check-Windows-DPAPI.ps1

  bun:
    # Magpie runs plugins on its bundled Bun; keep this version in step with it.
    name: Bun 1.4.4 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test --timeout 30000 ./tests
