name: Secret Scan (Gitleaks)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Git history + working tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "Reachable commits: $(git rev-list --all --count)"
          echo "Gitleaks configuration: .gitleaks.toml"
          test -s .gitleaks.toml

      # Pinned linux/amd64 image (Gitleaks v8.30.1); no network or writes.
      # No findings artifact is uploaded. A failed scan blocks this check.
      - name: Scan all reachable Git history (redacted)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact=100 --config /repo/.gitleaks.toml \
            --log-opts='--all --full-history' /repo

      - name: Scan current checked-out files (redacted)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --no-banner --redact=100 --config /repo/.gitleaks.toml /repo
